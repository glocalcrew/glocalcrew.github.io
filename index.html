/* GLOCAL PASSPORT · Design system 2026
   A single, consolidated stylesheet. Existing application classes preserved. */
:root {
  --bg:#F4F6FB; --card:#FFFFFF; --surface:#F8FAFD;
  --ink:#142039; --muted:#5C6880; --line:#E3E8F1; --soft:#E3E8F1;
  --jade:#AE4412; --jade-soft:#FFF0E6; --on-jade:#FFFFFF;
  --brand:#F5763E; --navy:#142039;
  --hero-bg:#182847; --hero-text:#FFFFFF; --hero-muted:#C4D1E4;
  --can:#17663B; --can-soft:#EAF7EE;
  --check:#205A9E; --check-soft:#EAF1FC;
  --no:#A12D36; --no-soft:#FFF0F1;
  --c0:#E96854; --c1:#F0AE2B; --c2:#2E9A73; --c3:#4485E8; --c4:#8B6BD0;
  color-scheme:light;
}
@media (prefers-color-scheme:dark) {
  :root:not([data-theme="light"]) {
    --bg:#0B1220; --card:#121D30; --surface:#1A2940;
    --ink:#F2F6FD; --muted:#B8C4D7; --line:#304057; --soft:#304057;
    --jade:#FFB487; --jade-soft:#36271F; --on-jade:#182134;
    --brand:#FC8E5A; --navy:#E7EEF9;
    --hero-bg:#263A59; --hero-text:#FFFFFF; --hero-muted:#CFDAE9;
    --can:#A1E6B9; --can-soft:#183A2B;
    --check:#B3CFFF; --check-soft:#1A3155;
    --no:#FFB7BF; --no-soft:#44242C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"] {
  --bg:#0B1220; --card:#121D30; --surface:#1A2940;
  --ink:#F2F6FD; --muted:#B8C4D7; --line:#304057; --soft:#304057;
  --jade:#FFB487; --jade-soft:#36271F; --on-jade:#182134;
  --brand:#FC8E5A; --navy:#E7EEF9;
  --hero-bg:#263A59; --hero-text:#FFFFFF; --hero-muted:#CFDAE9;
  --can:#A1E6B9; --can-soft:#183A2B;
  --check:#B3CFFF; --check-soft:#1A3155;
  --no:#FFB7BF; --no-soft:#44242C;
  color-scheme:dark;
}
*, *::before, *::after { box-sizing:border-box }
html,body { min-height:100%; margin:0; }
html { scroll-padding-top:100px; }
body { background:var(--bg); color:var(--ink); font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; font-size:14px; line-height:1.55; letter-spacing:-.012em; }
button,select,input { font:inherit; color:inherit; }
button { cursor:pointer; }
a { color:var(--jade); }
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible {outline:3px solid var(--brand);outline-offset:3px;}
[hidden] { display:none!important; }
.demo { max-width:430px; margin:8px auto 12px; padding:0 12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:11px; color:var(--muted); }
.demo select { background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:12px; }
.phone { max-width:430px; margin:0 auto 28px; min-height:650px; background:var(--card); border:1px solid var(--line); border-radius:30px; box-shadow:0 18px 70px rgba(16,32,64,.08); display:flex; flex-direction:column; overflow:visible; }
.bar { z-index:9; position:sticky; top:0; padding:14px 19px 13px; display:flex; align-items:center; gap:11px; background:var(--card); color:var(--ink); border-radius:29px 29px 0 0; border-bottom:1px solid var(--line); }
.brand-icon { display:grid;place-items:center; flex:none; width:41px;height:41px; border-radius:14px; background:var(--hero-bg);color:#FFF; font-size:24px; transform:rotate(-6deg); }
.brand-icon span { transform:rotate(6deg); }
.brand-copy { flex:1;min-width:0; }
.brand-name { display:flex;align-items:baseline;gap:4px;font-size:17px;font-weight:900;line-height:1.1;letter-spacing:-.035em; }
.brand-name em {font-style:normal;color:var(--jade);}
.brand-sub { margin-top:3px; color:var(--muted); font-size:10px; letter-spacing:.065em; font-weight:700; }
.lang { flex:none;min-height:36px; min-width:64px; padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:12px;font-weight:700; }
.main { flex:1; min-width:0; padding:22px 20px 34px; }
h1,h2,p { overflow-wrap:break-word; }
h1 { font-size:25px;line-height:1.35;letter-spacing:-.055em;font-weight:800;margin:2px 0 13px; }
h2 { font-size:16px;line-height:1.4;letter-spacing:-.028em;font-weight:800;margin:24px 0 11px; }
.muted { color:var(--muted); }
.small {font-size:12px;line-height:1.65;}
.eyebrow { color:var(--jade);text-transform:uppercase;letter-spacing:.13em;font-size:10px;font-weight:900;margin:0 0 7px; }
.screen-intro { margin:1px 0 21px; }
.screen-intro h1 {margin:0 0 8px;}
.screen-intro p:last-child {margin-bottom:0;}
.today-heading { margin-bottom:17px; }
.today-heading h1 {margin:0;}
.section-head {display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:25px 0 14px;}
.section-head h2 {margin:0;font-size:18px;}
.section-head span {color:var(--muted);font-size:12px;white-space:nowrap;}
/* Simple, high-contrast mission card for current activity */
.status-card {background:var(--hero-bg);color:var(--hero-text);border-radius:21px;padding:19px 19px 18px;margin:0 0 12px;position:relative;overflow:hidden;}
.status-card::after {content:"";position:absolute;right:-37px;top:-67px;width:165px;height:165px;border:24px solid rgba(255,255,255,.045);border-radius:50%;pointer-events:none;}
.status-kicker {color:var(--hero-muted);display:flex;align-items:center;gap:7px;font-size:10px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;margin-bottom:9px;}
.live-dot {width:7px;height:7px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 4px rgba(245,118,62,.13);}
.status-title {font-size:19px;line-height:1.34;letter-spacing:-.035em;font-weight:800;max-width:315px;position:relative;z-index:1;}
.status-meta {margin-top:11px;color:var(--hero-muted);font-size:12px;line-height:1.55;max-width:315px;position:relative;z-index:1;}
.status-meta b {color:var(--hero-text);font-weight:800;}
/* Passport mission progress: one compact piece rather than two competing widgets */
.quest {background:var(--surface);border:1px solid var(--line);border-radius:19px;padding:15px 16px 15px;margin:0 0 12px;}
.quest-head {display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:11px;}
.q-title {font-size:15px;font-weight:800;letter-spacing:-.04em;}
.q-note {font-size:11px;color:var(--muted);margin-top:3px;}
.q-count {font-size:11px;color:var(--muted);white-space:nowrap;line-height:1.2;}
.q-count b {font-size:25px;font-weight:900;color:var(--ink);letter-spacing:-.06em;}
.stamps {display:flex;justify-content:space-between;gap:4px;margin:4px 0 14px;}
.stamp {height:30px;flex:1;max-width:35px;border-radius:12px;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:var(--muted);background:var(--card);}
.day {margin:0;}
.day-top,.day-ends{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--muted);}
.day-ends {margin-top:7px;}
.track {height:6px;border-radius:999px;background:var(--line);position:relative;}
.track.sm {height:5px;margin-top:8px;}
.fill {height:100%;border-radius:inherit;background:var(--brand);position:absolute;left:0;top:0;}
.dot {position:absolute;left:0;top:50%;width:12px;height:12px;border:3px solid var(--card);box-shadow:0 0 0 2px var(--brand);background:var(--brand);border-radius:50%;transform:translate(-50%,-50%);}
/* Itinerary */
.tl {margin:0;padding:0;list-style:none;}
.tl li {display:grid;grid-template-columns:34px 42px minmax(0,1fr);gap:7px;position:relative;padding:13px 0 17px;border-bottom:1px solid var(--line);align-items:start;}
.tl li:last-child{border-bottom:0;}
.tl li::before{content:"";position:absolute;left:16px;top:46px;bottom:-17px;width:1.5px;background:var(--line);}
.tl li:last-child::before{display:none;}
.node {display:grid;place-items:center;width:33px;height:33px;background:var(--surface);border:1.5px solid var(--line);border-radius:11px;color:var(--muted);font-size:12px;font-weight:800;z-index:1;}
.node.ok {color:#fff;border:0;}
.node.on {color:#fff;background:var(--hero-bg);border:0;box-shadow:0 0 0 4px var(--jade-soft);}
.tl .t {padding-top:9px;font-size:12px;font-weight:800;letter-spacing:-.01em;color:var(--muted);}
.tl .w {font-size:14px;line-height:1.45;font-weight:800;letter-spacing:-.026em;}
.tl .p {font-size:12px;line-height:1.6;color:var(--muted);margin-top:4px;}
.tl .p:empty {display:none;}
.tl li.done .w {font-weight:600;}
.tl li.now {background:var(--jade-soft);border:1px solid var(--brand);border-radius:17px;padding:13px 11px;margin:7px -11px;box-shadow:0 5px 16px rgba(183,87,38,.06);}
.tl li.now::before{left:27px;top:46px;bottom:-22px;}
.tl li.now .w{color:var(--ink);}
.tl li.now .t {color:var(--jade);}
.pill {display:inline-flex;align-items:center;vertical-align:1px;margin-left:7px;padding:3px 7px;border-radius:6px;font-size:9px;font-weight:900;letter-spacing:.06em;background:var(--hero-bg);color:#fff;}
.more,.act {display:inline-flex;align-items:center;gap:5px;font-size:12px;line-height:1.5;font-weight:800;border:0;background:none;color:var(--jade);padding:5px 0;margin:4px 10px 0 0;text-align:left;text-decoration:none;}
.act {text-decoration:underline;text-underline-offset:3px;}
.more .chev {display:inline-block;transition:transform .18s;}
.more[aria-expanded="true"] .chev {transform:rotate(180deg);}
.more-body {padding:2px 0 3px;}
.sub {list-style:none;margin:11px 0 4px;padding:0 0 0 12px;border-left:2px solid var(--line);}
.sub li {display:flex;gap:8px;padding:4px 0;border:0;font-size:12px;color:var(--muted);}
.sub li::before {display:none;}
.sub .st {font-weight:800;min-width:43px;color:var(--muted);}
.sub li.snow {color:var(--ink);font-weight:800;}
.sub li.snow .st {color:var(--jade);}
.sub li.sdone {opacity:.75;}
/* Food: deliberately calm and clinical rather than a game */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:13px 0 21px;}
.chip{background:var(--surface);border:1.5px solid var(--line);padding:10px 13px;min-height:42px;border-radius:999px;color:var(--ink);font-size:12px;font-weight:700;}
.chip[aria-pressed="true"]{background:var(--jade-soft);color:var(--jade);border-color:var(--jade);}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;}
.ingchip{display:flex;align-items:center;gap:8px;min-width:0;min-height:61px;padding:11px 9px!important;background:var(--card);border:1.5px solid var(--line);border-radius:13px;font-size:12px;line-height:1.4;font-weight:600;cursor:pointer;}
.ingchip:has(input:checked){border-color:var(--jade);background:var(--jade-soft);color:var(--ink);}
.ingchip input {width:17px;height:17px;flex:none;margin:0;accent-color:var(--jade);}
.ingchip .emo{font-size:17px;flex:none;}
.btn{display:block;width:100%;min-height:48px;margin-top:16px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--hero-bg);background:var(--hero-bg);color:#fff!important;font-weight:800;font-size:13px;text-align:center;text-decoration:none;line-height:1.6;}
.btn.ghost{border:1.5px solid var(--line);background:var(--card);color:var(--ink)!important;}
.diet{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:15px;padding:14px;font-size:12px;line-height:1.6;}
.diet span{flex:1;min-width:0;overflow-wrap:anywhere;}
.link{border:0;background:none;padding:5px 0;color:var(--jade);font-size:12px;font-weight:800;text-decoration:underline;text-underline-offset:3px;}
.menu{padding:13px 0;border-bottom:1px solid var(--line);}
.menu .mn{font-size:14px;font-weight:700;line-height:1.55;}
.menu .ing{font-size:12px;color:var(--muted);margin-top:4px;}
.tag{display:inline-block;margin:5px 4px 2px 0;padding:4px 9px;border-radius:8px;font-size:11px;font-weight:800;line-height:1.5;}
.t-can{background:var(--can-soft);color:var(--can)}
.t-check{background:var(--check-soft);color:var(--check)}
.t-no{background:var(--no-soft);color:var(--no)}
.sum{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 8px;}
.menu .ev{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.5;}
details summary{cursor:pointer;color:var(--ink);font-weight:700;font-size:12px;margin:16px 0 10px;list-style:none;}
details summary::before{content:"+  ";color:var(--jade)}
details[open] summary::before{content:"−  ";}
.quiet,.contact{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:17px;margin-top:22px;}
.quiet h2{margin:0 0 8px;}
.contact h2{margin-top:0;}
.note{font-size:11px;line-height:1.75;color:var(--muted);margin:16px 0;}
/* Nearby / map */
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;padding:5px;border-radius:15px;background:var(--surface);border:1px solid var(--line);margin-bottom:22px;}
.seg button{min-height:43px;background:transparent;border:0;border-radius:11px;color:var(--muted);font-size:12px;font-weight:800;padding:9px 6px;}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 5px rgba(0,0,0,.09);}
.map{width:100%;height:255px;position:relative;z-index:0;border:1px solid var(--line);border-radius:17px;overflow:hidden;margin:0 0 9px;background:var(--surface);}
.map-note{font-size:11px;line-height:1.55;color:var(--muted);margin:0 0 18px;}
.info{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px 13px;margin:10px 0;}
.info .p{margin:0;font-size:12px;line-height:1.6;}
.info .p + .p{margin-top:5px;}
.place{border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:11px;background:var(--card);}
.place.picked{border:1.5px solid var(--jade);background:var(--jade-soft);}
.place .n{font-size:14px;font-weight:800;line-height:1.5;}
.place .ko{font-weight:500;font-size:12px;color:var(--muted);margin-left:5px;}
.place .meta{margin-top:5px;font-size:12px;color:var(--muted);line-height:1.6;}
.place .ing{color:var(--muted);font-size:12px;margin-top:7px;}
.maps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:11px;}
.mapbtn{display:flex;align-items:center;justify-content:center;gap:5px;min-height:42px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-size:10px;font-weight:800;text-decoration:none;text-align:center;padding:8px 3px;}
.mapbtn .logo{width:18px;height:18px;object-fit:contain;}
.mapbtn .logo:not([src]),.mapbtn .logo[src=""]{display:none;}
.mapbtn .pin{width:20px;height:20px;}
.num{display:inline-flex;vertical-align:1px;align-items:center;justify-content:center;margin-right:7px;width:22px;height:22px;border-radius:8px;color:#fff;font-size:11px;font-weight:800;}
.num.can,.pin.can{background:#22734A;}
.num.check,.pin.check{background:#2865A9;}
.pin{display:flex;align-items:center;justify-content:center;border:2px solid white;border-radius:50%;color:#fff;font-size:12px;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.22);}
.pin.home{background:#B34F1C;border-radius:9px;padding:0 6px;width:auto!important;}
.pin.me{background:#2379E1;}
.pin.osm{background:#8B939A;border-width:1.5px;}
.pin.sel{box-shadow:0 0 0 4px rgba(234,111,57,.3),0 2px 6px rgba(0,0,0,.2);}
.leaflet-container{font-family:"Noto Sans KR",sans-serif;}
.map-me{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 9px;font-size:11px;font-weight:800;cursor:pointer;}
.leaflet-top.leaflet-right .map-me{display:block;margin-top:8px;}
.route-info{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:10px;background:var(--surface);font-size:12px;}
.pop{min-width:180px;font-family:"Noto Sans KR",sans-serif;}
.pop-n{font-weight:800;font-size:13px;}
.pop-m{font-size:11px;color:#5C6880;margin:3px 0 6px;}
.pop-b{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;}
.pop-b button{border:0;border-radius:8px;padding:8px 2px;background:#142039;color:#fff;font-size:11px;font-weight:800;}
.pop-b button.ghost{background:#fff;color:#142039;border:1px solid #E3E8F1;}
.biz-tip{font-size:12px;font-weight:800;padding:4px 7px;border-radius:7px;}
.grp{font-weight:800;font-size:12px;margin:22px 0 9px;}
.g-can{color:var(--can)}.g-check{color:var(--check)}
.notice{border:1px solid var(--line);border-left:4px solid var(--no);background:var(--no-soft);border-radius:12px;padding:11px 13px;color:var(--ink);font-size:12px;line-height:1.65;margin:0 0 19px;}
.notice b{color:var(--no);}
.toast{position:sticky;bottom:78px;z-index:12;background:var(--ink);color:var(--card);padding:12px 15px;border-radius:12px;margin:0 20px;font-size:12px;text-align:center;}
.sample{max-width:430px;margin:0 auto;padding:0 20px 24px;color:var(--muted);text-align:center;font-size:10px;line-height:1.6;}
/* Always-visible tab bar, with consistent custom vector icons */
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));position:sticky;bottom:0;z-index:10;min-height:70px;border-top:1px solid var(--line);border-radius:0 0 29px 29px;background:var(--card);padding:5px 8px calc(7px + env(safe-area-inset-bottom, 0px));box-shadow:0 -8px 24px rgba(16,30,55,.035);}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:55px;color:var(--muted);background:none;border:0;font-size:11px;font-weight:800;border-radius:11px;padding:7px 3px;}
.tabs button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;}
.tabs button[aria-current="page"]{color:var(--jade);background:var(--jade-soft);}
/* Dark OSM tiles: muted, do not invert markers */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .map.osm-tiles .leaflet-tile{filter:invert(.9) hue-rotate(180deg) brightness(.83) contrast(.93)}}
:root[data-theme="dark"] .map.osm-tiles .leaflet-tile{filter:invert(.9) hue-rotate(180deg) brightness(.83) contrast(.93)}
@media (prefers-reduced-motion:no-preference){
 .fill,.dot{transition:width .35s ease,left .35s ease;}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important;}}
@media (max-width:480px){
 .phone{border:none;border-radius:0;box-shadow:none;max-width:none;margin:0;min-height:100dvh;}
 .bar{top:0;border-radius:0;padding-top:calc(12px + env(safe-area-inset-top,0px));}
 .tabs{border-radius:0;}
 .sample{padding-top:12px;}
}

body{font-family:"Manrope","Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;

 box-shadow:0 20px 72px rgba(8,29,52,.10);}

 border-radius:27px 27px 0 0;gap:12px;}

 display:grid;place-items:center;color:white;}

 font-weight:900;border-radius:999px;font-size:10px;padding:7px 10px;letter-spacing:.05em;}
/* Ticket card: airline visual grammar without pretending to be an actual flight */
.boarding-pass{position:relative;background:var(--ticket-shell);border:1px solid var(--line);border-radius:22px;
 overflow:hidden;box-shadow:0 15px 28px rgba(13,39,63,.095);margin:0 0 17px;}
.pass-top{position:relative;padding:19px 18px 23px;color:var(--ticket-text);background:var(--ticket-top);overflow:hidden;}
.pass-top:before{content:"";position:absolute;right:-64px;top:-110px;width:205px;height:205px;border:1px solid rgba(255,255,255,.12);
 border-radius:50%;box-shadow:0 0 0 28px rgba(255,255,255,.022),0 0 0 60px rgba(255,255,255,.017);pointer-events:none;}
.pass-airline{position:relative;display:flex;justify-content:space-between;gap:8px;align-items:center;margin:0 0 19px;}
.pass-brand{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:10px;letter-spacing:.15em;}
.pass-brand svg{height:14px;width:14px;transform:rotate(-28deg);}

.pass-caption{font-size:10px;letter-spacing:.16em;font-weight:850;color:var(--ticket-meta);margin:0 0 8px;}
.pass-route{display:grid;grid-template-columns:minmax(0,1fr) 75px minmax(0,1fr);align-items:center;gap:5px;}
.pass-city{min-width:0;}
.pass-city:last-child{text-align:right;}
.pass-city span{display:block;color:var(--ticket-meta);font-size:9px;letter-spacing:.13em;font-weight:750;margin-bottom:4px;}
.pass-city strong{display:block;font-size:clamp(16px,5.1vw,22px);letter-spacing:-.06em;line-height:1.16;font-weight:900;overflow-wrap:anywhere;}
.pass-city small{display:block;font-size:10px;color:var(--ticket-meta);margin-top:5px;}
.pass-plane-route{display:flex;align-items:center;justify-content:center;color:#FFB38D;gap:4px;}
.pass-plane-route:before,.pass-plane-route:after{content:"";width:18px;border-top:2px dotted rgba(255,255,255,.5)}
.pass-plane-route svg{width:23px;height:23px;flex:none;transform:rotate(45deg)}
.pass-tear{height:1px;position:relative;background:repeating-linear-gradient(90deg, var(--line) 0 5px, transparent 5px 12px);margin:0 14px;}
.pass-tear:before,.pass-tear:after{content:"";position:absolute;z-index:1;width:24px;height:24px;background:var(--ticket-page);
 border:1px solid var(--line);border-radius:50%;top:50%;}
.pass-tear:before{left:-27px;transform:translateY(-50%)}
.pass-tear:after{right:-27px;transform:translateY(-50%)}
.pass-bottom{padding:19px 19px 16px;background:var(--ticket-shell)}
.pass-state{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px;}

.pass-activity{font-size:18px;line-height:1.43;letter-spacing:-.045em;font-weight:900;color:var(--ink);margin:0;}

.pass-bottom-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;padding-top:13px;border-top:1px solid var(--line);}
.pass-fact small{display:block;color:var(--muted);font-size:9px;letter-spacing:.10em;font-weight:800;margin-bottom:4px;}
.pass-fact strong{display:block;color:var(--ink);font-size:12px;font-weight:850;}
.pass-bottom-grid .pass-fact:last-child{text-align:right;}
.pass-foot{padding:9px 18px 12px;display:flex;align-items:end;justify-content:space-between;gap:6px;border-top:1px dashed var(--line)}
.pass-barcode{width:122px;height:22px;background:repeating-linear-gradient(90deg,var(--ink) 0px 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 9px,var(--ink) 9px 12px,transparent 12px 15px);opacity:.79;}

/* Food, dietary status and allergy messaging deliberately remain plain. */

.team-section{margin:19px 0 24px;padding:16px;border-radius:19px;border:1px solid var(--line);background:var(--surface,#f8f9fc)}
.team-header h2{margin:5px 0 5px;font-size:18px;letter-spacing:-.03em}.team-header p{font-size:12px;color:var(--muted);margin:0 0 12px;line-height:1.6}
.crew-team{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:7px 0;overflow:hidden}
.crew-team summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;min-height:49px;padding:10px 12px;margin:0;font-size:14px;color:var(--ink)}
.crew-team summary::-webkit-details-marker{display:none}.crew-team-number{font-weight:850;flex:1}.crew-team-count{font-size:12px;color:var(--muted);font-weight:650}.crew-team-arrow{font-size:18px;color:var(--muted)}.crew-team[open] .crew-team-arrow{transform:rotate(180deg)}
.crew-team ol{margin:0;padding:7px 15px 12px 36px;border-top:1px dashed var(--line);font-size:13px;line-height:1.9;overflow-wrap:anywhere;color:var(--ink)}
.crew-team li{padding:0 0 0 3px}.team-footnote{font-size:11px;color:var(--muted);margin:12px 0 0;line-height:1.6}
.ygg-panel{margin:12px 0 18px;border:1px solid var(--line);border-radius:18px;background:var(--card);padding:17px;box-shadow:0 5px 16px rgba(8,30,50,.04)}
.ygg-label{font-size:11px;font-weight:850;letter-spacing:.1em;color:var(--jade);display:flex;align-items:center;gap:7px}
.ygg-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--jade)}
.ygg-panel h2{font-size:19px;letter-spacing:-.035em;margin:8px 0}.ygg-panel>p{font-size:13px;line-height:1.65;color:var(--ink);margin:0 0 13px}
.ygg-facts{display:grid;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}.ygg-facts>div{display:grid;grid-template-columns:91px 1fr;gap:10px;padding:10px 11px;border-bottom:1px solid var(--line);font-size:12px;line-height:1.5;align-items:start}
.ygg-facts>div:last-child{border-bottom:none}.ygg-facts b{font-size:11px;color:var(--muted);font-weight:800}.ygg-facts span{font-weight:650;color:var(--ink)}
.ygg-panel .ygg-foot{color:var(--muted);font-size:11px;margin:11px 0 0;line-height:1.6}
.ygg-contact h2{font-size:17px;margin:7px 0 6px}.ygg-contact .small{line-height:1.75}.ygg-directions{margin:7px 0 0}.ygg-directions summary{margin:0;cursor:pointer;color:var(--jade);font-size:12px;font-weight:800}.ygg-directions .maps{margin-top:10px}
.ygg-action-note{border-radius:12px;background:var(--jade-soft);color:var(--ink);padding:12px;display:flex;flex-direction:column;gap:5px;width:100%;font-size:12px;line-height:1.65}.ygg-action-note b{font-size:11px;color:var(--jade);letter-spacing:.05em}
.day2-food-note{padding:14px 16px;margin:16px 0;background:var(--surface,#f8f9fc);border:1px solid var(--line);border-radius:15px}.day2-food-note h2{margin:0 0 10px;font-size:17px}.day2-food-note p{font-size:13px;line-height:1.65;margin:8px 0;color:var(--ink)}
.breakfast-separate{border:1px solid var(--line);border-radius:13px;background:var(--card);padding:14px 15px;margin:13px 0 16px}
.breakfast-separate .meal-label{font-size:10px;letter-spacing:.09em;font-weight:850;color:var(--jade)}
.breakfast-separate h3{font-size:16px;margin:5px 0 8px;font-weight:850;letter-spacing:-.025em}
.breakfast-separate p{margin:0!important;font-size:13px;line-height:1.65}
.day2-food-note .lunch-heading{font-size:14px;margin:0 0 8px;font-weight:800}
@media(max-width:360px){.team-section{padding:12px}.ygg-panel{padding:13px}.ygg-facts>div{grid-template-columns:77px 1fr;gap:7px}}

/* Fix: selected radius must remain readable in both themes.
   --navy switches to a pale foreground color in dark mode,
   so using it as a selected-button background made white text disappear. */
.radius-controls button {
  min-height:42px;
  min-width:66px;
  font-size:13px;
  font-weight:850;
}
.radius-controls button[aria-pressed="true"] {
  background:#9C3B21;
  color:#FFFFFF;
  border-color:#9C3B21;
  font-weight:900;
}
.radius-controls button:focus-visible {
  outline:2px solid var(--brand);
  outline-offset:2px;
}

/* Venue names in the map, not generic button labels. GPS remains accessible. */
.map-quick-actions{display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin-top:10px;margin-right:10px;}
.map-quick-btn{display:inline-flex;align-items:center;justify-content:center;min-height:36px;max-width:165px;padding:7px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-family:inherit;font-size:12px;font-weight:800;line-height:1.25;text-align:center;box-shadow:0 2px 5px rgba(0,0,0,.16);cursor:pointer;white-space:normal;word-break:keep-all;}
.map-quick-btn[aria-pressed="true"]{background:#973c27;color:#fff;border-color:#973c27;}
.map-quick-btn:focus-visible{outline:3px solid var(--brand);outline-offset:2px;}
.map-quick-gps{width:40px;min-width:40px;height:40px;padding:0;border-radius:50%;}
.map-quick-gps svg{pointer-events:none;}
@media(max-width:370px){.map-quick-btn{font-size:11px;max-width:145px;padding:7px 9px;}}

/* Nov 13/Nov 14 operator clarity, compact team list, radius provenance */
.day-operator{--op:#f6a37e;position:relative;margin:3px 0 14px;padding:14px 16px 13px;border-radius:16px;border:1px solid var(--line);border-left:4px solid var(--op);background:var(--surface);color:var(--ink)}
.operator-ygg{--op:#8ad3b3}
.operator-kicker{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:10px;font-weight:850;letter-spacing:.04em}
.operator-dot{width:8px;height:8px;background:var(--op);border-radius:50%;flex:none}
.operator-name{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:6px;font-size:19px;font-weight:900;line-height:1.4;letter-spacing:-.035em}
.operator-day{font-size:10px;font-weight:850;letter-spacing:.04em;color:var(--muted);white-space:nowrap}
.day-operator p{font-size:11.5px;line-height:1.6;color:var(--muted);margin:4px 0 0}
.pass-operator{font-size:9px;letter-spacing:0;font-weight:800;color:#ead7c7}
.team-collapse{margin:21px 0 13px;border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.team-collapse>summary{display:flex;align-items:center;gap:11px;margin:0;padding:15px 14px;min-height:64px;color:var(--ink);cursor:pointer;list-style:none}
.team-collapse>summary::-webkit-details-marker{display:none}
.team-summary-icon{width:33px;height:33px;display:grid;place-items:center;border-radius:10px;background:var(--jade-soft);color:var(--jade);font-size:17px;flex:none}
.team-summary-copy{display:flex;flex:1;flex-direction:column;gap:3px;min-width:0}
.team-summary-copy b{font-size:13px;line-height:1.35;font-weight:850}
.team-summary-copy small{color:var(--muted);font-size:10.5px;line-height:1.5}
.team-summary-chevron{color:var(--muted);font-size:21px;transition:transform .2s}
.team-collapse[open] .team-summary-chevron{transform:rotate(180deg)}
.team-collapse .team-section{border:0;border-radius:0;margin:0;padding:2px 15px 15px;background:transparent;box-shadow:none}
.team-collapse .team-header{display:none}
.radius-result-summary{margin:7px 0 4px;padding:9px 11px;border:1px solid var(--line);border-radius:11px;font-size:12px;line-height:1.5;color:var(--ink);font-weight:800;background:var(--surface)}
.radius-fallback{border:1px solid var(--line);border-left:3px solid var(--jade);border-radius:11px;padding:11px 12px;margin:8px 0 12px;font-size:12px;background:var(--surface)}
.radius-fallback b{color:var(--ink);font-size:12px}
.radius-fallback p{color:var(--muted);margin:5px 0 10px;line-height:1.6}
.retry-osm{min-height:37px;padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;font-size:12px}
@media(max-width:360px){.operator-name{font-size:17px}.day-operator{padding:12px}.operator-day{font-size:9px}}
@media(prefers-reduced-motion:reduce){.team-summary-chevron{transition:none}}

.jump-route{display:block;width:100%;margin:10px 0 4px;padding:11px 14px;border-radius:14px;border:1.5px dashed var(--line);background:transparent;color:var(--jade);font-weight:800;font-size:14px;text-align:center;cursor:pointer}
#route-head{scroll-margin-top:84px}

.menu.m-check,.menu.m-no{border-left:4px solid var(--check);background:var(--check-soft);border-radius:12px;padding:12px 12px 12px 14px;margin:10px 0;border-bottom:0}
.menu.m-no{border-left-color:var(--no);background:var(--no-soft)}
.menu.m-check .ing{color:var(--check);font-weight:700}
.menu.m-no .ing{color:var(--no);font-weight:700}
.m-flag{margin-left:4px;vertical-align:middle;font-size:11px}
</style>

</head>
